name: Release

# Push a tag like v1.2.3 to build and publish a release. The tag is the version shown in the app's About box.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test GitSona.slnx -c Release

  windows:
    name: Windows (x64 + arm64, installer)
    needs: [meta, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Optional code signing. Add a repository secret GITSONA_SIGN_PARAMS (a signtool parameter string,
      # or the arguments for a signing service such as SignPath) and the installer is signed; without it, unsigned.
      - name: Build portable exes and installer
        shell: pwsh
        env:
          GITSONA_SIGN_PARAMS: ${{ secrets.GITSONA_SIGN_PARAMS }}
        run: ./build.ps1 -Version "${{ needs.meta.outputs.version }}" -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            artifacts/GitSona-portable.exe
            artifacts/GitSona-arm64.exe
            artifacts/GitSona-Setup.exe
            artifacts/installer/*.nupkg
            artifacts/installer/releases.win.json
            artifacts/installer/assets.win.json
            artifacts/installer/RELEASES

  linux:
    name: Linux x64
    needs: [meta, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: SKIP_TESTS=1 bash build.sh "${{ needs.meta.outputs.version }}" linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            artifacts/linux-x64/*.tar.gz
            artifacts/linux-x64/velopack/*

  macos:
    name: macOS ${{ matrix.rid }}
    needs: [meta, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: SKIP_TESTS=1 bash build.sh "${{ needs.meta.outputs.version }}" ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          if-no-files-found: error
          path: |
            artifacts/${{ matrix.rid }}/*.tar.gz
            artifacts/${{ matrix.rid }}/velopack/*

  release:
    name: Publish GitHub Release
    # Windows is the primary target and must succeed; Linux/macOS are published when they built.
    needs: [windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # Every user-facing download. Feed files for auto-update are attached but not listed.
          ls -1 | grep -Ev '\.(json|nupkg)$|^RELEASES$|^assets\.' | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "GitSona $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Downloads are unsigned in v1. Verify them against SHA256SUMS.txt (see the README for the Windows SmartScreen note)."
